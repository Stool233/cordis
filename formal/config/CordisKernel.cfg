SPECIFICATION KernelSpec

CONSTANTS
  Fibers = {f1, f2, f3}
  Keys = {k1, k2}
  Root = root
  None = none
  MaxIterations = 2
  MaxDepth = 1
  AllowFailure = TRUE
  AcyclicDependencies = TRUE
  FiniteNames = TRUE
  BoundedIterator = TRUE
  PairwiseIndependent = TRUE
  TotalProvision = TRUE
  ExploreAllTopologies = FALSE
  ProviderFiber = f1
  ConsumerFiber = f2
  SiblingFiber = f3

INVARIANTS
  Preservation
  RecoveryExactness
  Ordering
  ResolutionCoherence

PROPERTIES
  Progress
